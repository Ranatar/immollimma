<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ainulindalë — Музыка Айнур</title>
<style>
@font-face{font-family:Ea;src:url(data:font/ttf;base64,/*FONT*/) format("truetype");}
html,body{margin:0;height:100%;overflow:hidden;background:#04050a;}
body{background:radial-gradient(ellipse at 50% 50%,#0b0d18 0%,#06070e 55%,#020205 100%);cursor:default;}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
#veil{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%);}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
#start div{width:84px;height:84px;border-radius:50%;border:1px solid rgba(240,214,150,.55);
  box-shadow:0 0 40px rgba(240,214,150,.18),inset 0 0 24px rgba(240,214,150,.12);position:relative;transition:transform .4s;}
#start div:after{content:"";position:absolute;left:34px;top:27px;border-style:solid;border-width:15px 0 15px 24px;
  border-color:transparent transparent transparent rgba(244,222,166,.85);}
#start:hover div{transform:scale(1.06);}
#bar{position:fixed;left:0;bottom:0;height:2px;background:rgba(240,214,150,.25);width:0;opacity:0;transition:opacity 1s;}
body.ui #bar{opacity:1;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"></div>
<div id="bar"></div>
<div id="start"><div></div></div>
<audio id="au" preload="auto" src="data:audio/mpeg;base64,/*AUDIO*/"></audio>
<script>
"use strict";
const D = /*DATA*/;
const LEN = D.length, TAU = Math.PI * 2, OM = TAU / 17, FS = 40;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const small = document.createElement("canvas"), sctx = small.getContext("2d");
const whole = document.createElement("canvas"), wctx = whole.getContext("2d");
const echo = document.createElement("canvas"), ectx = echo.getContext("2d");
let W = 0, H = 0, S = 0, CX = 0, CY = 0, R = 0, K = 1;

// ------------------------------------------------------------------ утилиты
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };
function lin(tab, t) {                      // кусочно-линейная функция по таблице [[t, v], ...]
  if (t <= tab[0][0]) return tab[0][1];
  for (let i = 1; i < tab.length; i++) if (t < tab[i][0]) {
    const [a, x] = tab[i - 1], [b, y] = tab[i]; return x + (y - x) * (t - a) / (b - a);
  }
  return tab[tab.length - 1][1];
}
function hsl(h, s, l) {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
}
const mix = (c1, c2, u) => [0, 1, 2].map(i => Math.round(c1[i] + (c2[i] - c1[i]) * u));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function rnd(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const rN = m => 0.07 + 0.93 * (m - 24) / 78;          // высота → радиус (доля R): низ у центра, верх к краю
function env(n, tau) {                                 // n = [t, d, m, a, att, rel]
  const u = tau - n[0]; if (u < 0) return 0;
  const att = Math.max(0.03, Math.min(n[4], n[1] * 0.5)), rel = Math.max(0.15, n[5]);
  if (u < att) return n[3] * u / att;
  if (u < n[1]) return n[3];
  return n[3] * Math.exp(-(u - n[1]) / (rel * 0.6));
}
const envEnd = n => n[0] + n[1] + Math.max(0.15, n[5]) * 3;

// ------------------------------------------------------------------ время сочинения
const T = { great: 44.5, devA: 81, ret: 101.4, melkor: 113, sea: 126, sec: 148, battle: 166, mastery: 180,
  third: 188, t3b: 200, t3c: 216, unison: 212, absorb: 232, chord: 248, silence: 252.5, vision: 257,
  child: 276.5, vcut: 282.5, ea: 286 };
const phM = t => -Math.PI / 2 + 1.7 * OM * (t - T.melkor);           // фаза Мелькора: ровный навязанный ход
const troubled = t => clamp((t - 114) / 8, 0, 1);                     // смятение соседей
function discord(t) {                                                  // мера разлада для решётки
  return lin([[113, 0], [118, .35], [126, .8], [136, 1], [146, .9], [150, .3], [164, .3], [168, .9], [186, 1],
    [192, .45], [210, .3], [212, .15], [232, .15], [242, 0]], t);
}
// лад решётки по времени
const F_D = [2, 4, 6, 9, 11], F_A = [9, 11, 1, 4, 6], F_INV = [2, 5, 7, 10, 0], F_DOR = [2, 4, 5, 7, 9, 11, 0];
const LATTICE = [[22, 81, F_D], [81, 101.4, F_A], [101.4, 148, F_D], [148, 188, F_INV], [188, 248, F_DOR]];
const JI = { 0: 0, 1: 11.7, 2: 3.9, 3: 15.6, 4: -13.7, 5: -2, 6: -9.8, 7: 2, 8: 13.7, 9: -15.6, 10: -3.9, 11: -11.7 };
const ji = m => JI[((m - 2) % 12 + 12) % 12] / 100;

// ------------------------------------------------------------------ цвета и семейства нитей
const GOLD = hsl(44, 85, 74), WGOLD = hsl(40, 70, 86), RED = hsl(4, 88, 52), EMBER = hsl(16, 95, 58);
const HEAT = hsl(8, 100, 62), ICE = hsl(188, 95, 72);   // Мелькор — крайности: жар и лёд, ярче всего прочего
const DEVC = [hsl(30, 75, 64), hsl(210, 35, 86), hsl(172, 55, 68), hsl(24, 55, 48), hsl(50, 80, 66), hsl(128, 38, 70)];
const SECC = [hsl(262, 45, 80), hsl(232, 50, 78), hsl(285, 40, 78), hsl(250, 35, 62)];
const FAM = {
  solo:   { L: 7, tau: 3, w: 1.8, a: 1 },
  expo:   { L: 26, tau: 18, w: 2.8, a: 1 },
  cantus: { L: 22, tau: 10, w: 2.6, a: .9 },
  dev:    { L: 12, tau: 5, w: 1.6, a: .9 },
  mel:    { L: 7, tau: 2.6, w: 2.6, a: 1 },
  str:    { L: 3.5, tau: 1.2, w: 2.0, a: .9 },
  sec:    { L: 18, tau: 9, w: 2.4, a: .9 },
  secv:   { L: 10, tau: 4.5, w: 1.5, a: .85 },
  t3:     { L: 20, tau: 15, w: 2.6, a: 1 },
  uni:    { L: 30, tau: 30, w: 2.4, a: .9 },
};
const DEV_VAL = [0.6, 0.3, 0.15, 2.4, 1.0, 0.45], DEV_PH = [0.6, 2.3, 3.9, 5.1, 1.4, 4.5], DEV_LOCK = [1, .55, .4, 1, 1, .6];
const SEC_VAL = [0.4, 0.2, 0.3, 1.6], SEC_PH = [1.0, 3.1, 4.6, 5.6];

// ------------------------------------------------------------------ подготовка нитей
const threads = [], globeThreads = [];
function prep(th) {
  const ns = th.notes, f = th.fam;
  const t0 = ns[0][0], last = ns[ns.length - 1];
  th.tA = t0 - 0.05; th.tB = Math.max(...ns.map(envEnd));
  let mode = "arc", om = OM, ph = -Math.PI / 2, lock = 0, col = GOLD, poly = null, local = null, width = 1;
  let k = 1, mirror = false;
  if (f === "solo") {
    mode = "local"; om = TAU / 5.5; col = hsl([40, 200, 170, 30, 52, 220, 44, 190, 25][th.i], 45, 78);
    const ang = -Math.PI / 2 + th.pan * 2.2 + th.i * 0.9, dist = 0.62 - 0.035 * th.i;
    local = [Math.cos(ang) * dist, Math.sin(ang) * dist];
    ph = ang + Math.PI;
  } else if (f === "expo") {
    col = [WGOLD, GOLD, hsl(38, 60, 66), hsl(34, 55, 58)][th.cls]; width = [1.25, .85, .6, .55][th.cls];
  } else if (f === "cantus") { om = OM / th.unit; col = th.key.startsWith("ret") ? WGOLD : GOLD; }
  else if (f === "dev") { om = OM * Math.pow(DEV_VAL[th.vi], -0.55) / 2.6; ph = -Math.PI / 2 + DEV_PH[th.vi] / 5; lock = DEV_LOCK[th.vi]; col = DEVC[th.vi]; k = 5; if (th.vi === 2) width = 0.8; }
  else if (f === "sec") { om = -OM / th.unit; col = th.key === "sec_pk" ? hsl(268, 55, 88) : SECC[0]; }
  else if (f === "secv") { om = -OM * Math.pow(SEC_VAL[th.vi], -0.55) / 2.6; ph = -Math.PI / 2 + SEC_PH[th.vi] / 7; col = SECC[th.vi]; k = 7; mirror = true; }
  else if (f === "t3") {
    om = TAU / (16 * th.beat);
    col = th.line < 406 ? hsl(350, 45, 86) : th.line < 410 ? hsl(28, 65, 78) : hsl(205, 45, 78);
  } else if (f === "mel") { mode = "poly"; poly = t => phM(t); col = th.key.startsWith("mel356") ? ICE : HEAT; }
  else if (f === "str") { mode = "poly"; const b = -Math.PI / 2 + th.pan * Math.PI + th.k * 0.9; poly = t => b + (t - t0) * 2.2; col = th.k % 2 ? ICE : HEAT; }
  else if (f === "uni") { mode = "poly"; poly = t => -Math.PI / 2 + (t - T.unison) * TAU / 24; col = ICE; }
  else { globeThreads.push(th); return; }
  const fam = FAM[f];
  th.L = fam.L; th.tau = fam.tau; th.w = fam.w * width; th.a = fam.a; th.col = col; th.mode = mode;
  th.copies = [];                                       // узор Айнур: поворот на 2π/5 (и зеркало у второй темы)
  for (let j = 0; j < k; j++) { th.copies.push([j * TAU / k, false]); if (mirror) th.copies.push([j * TAU / k, true]); }
  th.bundle = f === "cantus" ? 9 : f === "dev" ? 3 : f === "secv" ? 2 : 1;   // Айнур много: голос — хор нитей
  const arc = f === "uni";                               // для вбирания: тот же унисон, но дугами
  const xs2 = arc ? new Float32Array(Math.ceil((th.tB - th.tA) * FS) + 2) : null, ys2 = arc ? new Float32Array(xs2.length) : null;
  const N = Math.ceil((th.tB - th.tA) * FS) + 2;
  const xs = new Float32Array(N), ys = new Float32Array(N), I = new Float32Array(N), M = new Float32Array(N), Lk = new Float32Array(N);
  let ni = 0;
  for (let i = 0; i < N; i++) {
    const tau = th.tA + i / FS;
    while (ni + 1 < ns.length && ns[ni + 1][0] <= tau) ni++;
    const n = ns[ni];
    let m = n[2];
    if (ni > 0 && tau >= n[0]) {
      const g = clamp(0.6 * n[1], 0.08, 0.7), u = (tau - n[0]) / g;   // плавный перелив, не ступенька
      if (u < 1) { const pm = ns[ni - 1][2], s = u * u * (3 - 2 * u); m = pm + (n[2] - pm) * s; }
    }
    let e = env(n, tau); if (ni > 0) e = Math.max(e, env(ns[ni - 1], tau));
    if (tau >= n[0]) e += n[3] * 0.55 * Math.exp(-(tau - n[0]) / 0.1);   // вспышка атаки
    I[i] = e; M[i] = n[2];
    let x, y;
    if (mode === "poly") {
      const va = poly(n[0]), vr = rN(n[2]);
      x = Math.cos(va) * vr; y = Math.sin(va) * vr;
      if (ni > 0 && tau < n[0] + 0.06) {
        const p = ns[ni - 1], pa = poly(p[0]), pr = rN(p[2]), u = clamp((tau - n[0]) / 0.06, 0, 1);
        x = Math.cos(pa) * pr + (x - Math.cos(pa) * pr) * u; y = Math.sin(pa) * pr + (y - Math.sin(pa) * pr) * u;
      }
      if (arc) {
        const nx = ns[ni + 1];
        let a2 = va, r2 = vr;
        if (nx && tau >= n[0]) {
          const v = clamp((tau - n[0]) / (nx[0] - n[0]), 0, 1), sv = v * v * (3 - 2 * v);
          a2 = va + (poly(nx[0]) - va) * v; r2 = vr + (rN(nx[2]) - vr) * sv;
        }
        xs2[i] = Math.cos(a2) * r2; ys2[i] = Math.sin(a2) * r2;
      }
    } else if (mode === "local") {
      const rr = 0.05 + 0.12 * clamp((m - 50) / 32, 0, 1);
      x = local[0] + Math.cos(ph) * rr; y = local[1] + Math.sin(ph) * rr;
      ph += om / FS;
    } else {
      const rr = rN(m);
      x = Math.cos(ph) * rr; y = Math.sin(ph) * rr;
      let lk = 0;
      if (lock && tau > 113) {                        // Курамото: соседи Мелькора втягиваются в его ход
        lk = troubled(tau) * lock;
        for (let s = 0; s < 4; s++) ph += (om * (1 - 0.6 * lk) + 1.7 * OM * 0.6 * lk + 3.0 * OM * lk * Math.sin(phM(tau) - ph)) / (FS * 4);
      } else ph += om / FS;
      Lk[i] = lk;
    }
    xs[i] = x; ys[i] = y;
  }
  Object.assign(th, { xs, ys, I, M, Lk, N, xs2, ys2 });
  threads.push(th);
}
D.threads.forEach(prep);

// ------------------------------------------------------------------ кольца и вспышки
const rings = D.rings.map(r => ({ n: r.slice(0, 6), fam: r[6], x: r[7] || {}, end: envEnd(r) }));
const fx = D.fx.map((r, i) => ({ n: r.slice(0, 6), fam: r[6], i, end: envEnd(r) }));
const byFam = f => fx.filter(x => x.fam === f);
const FX_RIPPLE = byFam("ripple"), FX_TIMP = byFam("timp"), FX_VHARP = byFam("vharp"), FX_AULE = byFam("aule"),
  FX_RAIN = byFam("rain"), FX_PULSE = byFam("pulse"), FX_TAM = byFam("tamtam"), FX_CYM = byFam("cymbal");
// рябь третьей темы рождается там, где сейчас её голос
const t3solo = threads.find(t => t.fam === "t3" && t.line < 406);
for (const r of FX_RIPPLE) {
  const th = t3solo, i = clamp(Math.round((r.n[0] - th.tA) * FS), 0, th.N - 1);
  const a = Math.atan2(th.ys[i], th.xs[i]), rr = rN(r.n[2]);
  r.p = [Math.cos(a + 0.05) * rr, Math.sin(a + 0.05) * rr];
}

// ------------------------------------------------------------------ размер
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = cv.width = Math.round(innerWidth * dpr); H = cv.height = Math.round(innerHeight * dpr);
  S = Math.min(W, H); CX = W / 2; CY = H / 2; R = 0.46 * S; K = S / 1000;
  small.width = Math.ceil(W / 4); small.height = Math.ceil(H / 4);
  whole.width = W; whole.height = H; drawWhole();
  echo.width = Math.ceil(W / 2); echo.height = Math.ceil(H / 2);
  last = -1;
}
// вся Музыка разом — для последнего аккорда
function drawWhole() {
  wctx.clearRect(0, 0, W, H); wctx.globalCompositeOperation = "lighter"; wctx.lineCap = "round";
  for (const th of threads) {
    if (th.fam === "solo") continue;
    wctx.strokeStyle = rgba(mix(th.col, WGOLD, 0.5), 0.16); wctx.lineWidth = th.w * K * 0.8;
    wctx.beginPath(); let pen = false;
    for (let i = 0; i < th.N; i += 2) {
      if (th.I[i] < 0.05) { pen = false; continue; }
      const x = CX + th.xs[i] * R, y = CY + th.ys[i] * R;
      if (pen) wctx.lineTo(x, y); else wctx.moveTo(x, y); pen = true;
    }
    for (const [ang, mir] of th.copies) {
      wctx.setTransform(1, 0, 0, 1, 0, 0); wctx.translate(CX, CY); wctx.rotate(ang); if (mir) wctx.scale(-1, 1); wctx.translate(-CX, -CY);
      wctx.stroke();
    }
    wctx.setTransform(1, 0, 0, 1, 0, 0);
  }
}

// ------------------------------------------------------------------ рисование музыки
function circle(r, col, a, w) { ctx.strokeStyle = rgba(col, a); ctx.lineWidth = w; ctx.beginPath(); ctx.arc(CX, CY, r, 0, TAU); ctx.stroke(); }
function noisyRing(r, amp, seed, t, col, a, w, n = 160) {
  const q = rnd(seed), ph = [q() * TAU, q() * TAU, q() * TAU, q() * TAU], sp = [q() - .5, q() - .5, q() - .5, q() - .5];
  ctx.strokeStyle = rgba(col, a); ctx.lineWidth = w; ctx.beginPath();
  for (let k = 0; k <= n; k++) {
    const th = k / n * TAU;
    const d = Math.sin(3 * th + ph[0] + t * sp[0] * 3) * .45 + Math.sin(5 * th + ph[1] + t * sp[1] * 5) * .3
      + Math.sin(11 * th + ph[2] + t * sp[2] * 9) * .18 + Math.sin(17 * th + ph[3] - t * 6) * .1;
    const rr = r + amp * d, x = CX + Math.cos(th) * rr, y = CY + Math.sin(th) * rr;
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
}

function latticeField(t) {
  for (const [a, b, f] of LATTICE) if (t >= a - 1.5 && t < b + 1.5) {
    const w = Math.min(sstep(a - 1.5, a + 1.5, t), 1 - sstep(b - 1.5, b + 1.5, t));
    if (w > 0.01) yield_(f, w);
  }
}
let yield_ = null;
function drawLattice(t, sym) {
  const fadeIn = sstep(22, 26, t), dis = discord(t), dim = 1 - 0.55 * dis;
  yield_ = (f, w) => {
    for (let m = 26; m <= 100; m++) {
      if (!f.includes(((m % 12) + 12) % 12)) continue;
      const r = rN(m + ji(m)) * R, s = sym.get(m) || 0;
      const a = (0.045 + 0.26 * s) * w * fadeIn * dim;
      if (a < 0.004) continue;
      const col = mix(hsl(42, 45, 70), RED, dis * 0.5);
      if (dis > 0.05) noisyRing(r, dis * 3.5 * K * (1 + (m % 5)), m * 7 + 3, t, col, a, 1 * K, 120);
      else circle(r, col, a, (0.9 + 1.2 * s) * K);
    }
  };
  latticeField(t);
}

function drawThread(th, t, gain) {
  if (t < th.tA || t > th.tB + th.L) return;
  const tEnd = Math.min(t, th.tB), iH = (tEnd - th.tA) * FS, i1 = Math.floor(iH);
  const i0 = Math.max(0, Math.floor((t - th.L - th.tA) * FS));
  if (i1 <= i0) return;
  // вбирание: угловатый унисон Мелькора изгибается дугами и встаёт звеном в узор
  const mu = th.xs2 ? sstep(T.absorb, T.absorb + 12, t) : 0;
  let X = th.xs, Y = th.ys;
  if (mu > 0) {
    X = new Float32Array(th.N); Y = new Float32Array(th.N);
    for (let i = i0; i <= Math.min(i1 + 1, th.N - 1); i++) { X[i] = th.xs[i] + (th.xs2[i] - th.xs[i]) * mu; Y[i] = th.ys[i] + (th.ys2[i] - th.ys[i]) * mu; }
  }
  const paths = new Map(), invTau = 1 / th.tau;
  const lkNow = th.Lk ? th.Lk[Math.min(i1, th.N - 1)] : 0;
  for (let i = i0; i < i1 && i + 1 < th.N; i++) {
    const age = t - (th.tA + i / FS);
    const al = (th.I[i] + th.I[i + 1]) * 0.5 * Math.exp(-age * invTau) * gain * th.a;
    if (al < 0.012) continue;
    const lv = Math.min(16, Math.max(1, Math.round(al * 14)));
    let p = paths.get(lv); if (!p) { p = new Path2D(); paths.set(lv, p); }
    p.moveTo(CX + X[i] * R, CY + Y[i] * R);
    p.lineTo(CX + X[i + 1] * R, CY + Y[i + 1] * R);
  }
  const j = Math.min(i1, th.N - 2), u = iH - j;
  const hx = CX + (X[j] + (X[j + 1] - X[j]) * u) * R, hy = CY + (Y[j] + (Y[j + 1] - Y[j]) * u) * R;
  const hI = th.I[j] * gain * th.a * (t <= th.tB ? 1 : 0);
  let col = lkNow > 0 ? mix(th.col, HEAT, lkNow * 0.7) : th.col;
  if (mu > 0) col = mix(col, WGOLD, mu);
  const isMel = th.mode === "poly";
  const setCopy = (ang, mir, sc) => {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(CX, CY); ctx.rotate(ang);
    ctx.scale(mir ? -sc : sc, sc); ctx.translate(-CX, -CY);
  };
  if (isMel && mu < 0.98) {                            // тьма вокруг Мелькора гасит чужой свет
    ctx.globalCompositeOperation = "destination-out"; ctx.lineWidth = 15 * K;
    for (const [lv, p] of paths) { ctx.strokeStyle = `rgba(0,0,0,${Math.min(.5, lv / 14 * .45) * (1 - mu)})`; ctx.stroke(p); }
    ctx.globalCompositeOperation = "lighter";
  }
  const rr = (3 + 5 * Math.min(1, hI)) * K * (isMel ? 1.4 : 1);
  let g = null;
  if (hI > 0.03) {
    g = ctx.createRadialGradient(hx, hy, 0, hx, hy, rr * 2.2);
    g.addColorStop(0, rgba(mix(col, [255, 255, 255], 0.6), Math.min(1, hI)));
    g.addColorStop(1, rgba(col, 0));
  }
  let copies = th.copies;
  if (mu > 0) copies = [0, 1, 2, 3, 4].map(q => [q * TAU / 5, false]);
  const core = mix(col, [255, 255, 255], 0.72);
  const mid = (th.bundle - 1) / 2;
  for (let c = 0; c < copies.length; c++) {
    const [ang, mir] = copies[c];

function drawFx(t) {

const CENTER = [[0, 0], [21.5, 0], [22, .7], [24.6, .35], [41.6, .6], [42.6, 1.0], [44.5, .45], [60, .45], [101.4, .55],

function drawMusic(t) {
  const gate = t < T.silence ? 1 : 0;

  const sym = new Map();
  const heads = [];
  ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round"; ctx.lineJoin = "round";

  const chordBoost = t >= T.chord ? 0.4 : 1;
  for (const th of threads) if (th.mode !== "poly") {
    const m = drawThread(th, t, chordBoost);

    const a = 0.55 * Math.exp(-(t - T.chord) / 1.1) * sstep(T.chord, T.chord + 0.1, t);

    const a = a0 + u * (0.05 + 0.25 * (1 - r)) * (s > .5 ? 1 : .8);
    const rr = r * R * (0.55 + 0.1 * Math.sin(u * 0.3 + s * 6));
    const x = CX + Math.cos(a) * rr, y = CY + Math.sin(a) * rr * 0.62;
    const al = cloud * (0.25 + 0.5 * b) * (1 - r * 0.6) * (0.7 + 0.3 * Math.sin(t * 2 + s * 30));
    if (al < 0.01) continue;
    ctx.fillStyle = rgba(b > .7 ? WGOLD : hsl(210, 30, 85), Math.min(.9, al));
    ctx.fillRect(x, y, 1.8 * K, 1.8 * K);
  }
  // сердце: литавра — удар, арфа с пиццикато — отзвук
  let beat = 0;
  for (const r of FX_TIMP) if (r.n[0] >= T.ea) {
    const v = t - r.n[0]; if (v < 0) continue;
    beat = Math.max(beat, Math.exp(-v / 0.22) * r.n[3] * 2.2);
    if (v < 2.2) circle(0.02 * R + v * 0.22 * R, WGOLD, 0.28 * (1 - v / 2.2) * r.n[3] * 2.5, 1.4 * K);
  }
  for (const r of FX_PULSE) { const v = t - r.n[0]; if (v >= 0) beat = Math.max(beat, Math.exp(-v / 0.18) * 0.55); }
  const firstBeat = FX_TIMP.find(r => r.n[0] >= T.ea).n[0];
  const core = sstep(T.ea + 1, firstBeat, t) * 0.35 + beat;
  if (core > 0.01) {
    const rr = (0.016 + 0.014 * beat) * R;
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, rr * 4);
    g.addColorStop(0, rgba([255, 244, 220], Math.min(1, core))); g.addColorStop(0.2, rgba(hsl(40, 85, 72), Math.min(.7, core * .55)));
    g.addColorStop(1, rgba(hsl(38, 80, 60), 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, rr * 4, 0, TAU); ctx.fill();
  }
  const ta = sstep(296.5, 300, t);
  if (ta > 0) {
    ctx.globalCompositeOperation = "source-over";
    ctx.font = `${Math.round(64 * K)}px Ea, Georgia, serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = rgba(hsl(40, 60, 82), 0.85 * ta);
    ctx.shadowColor = rgba(GOLD, 0.6 * ta); ctx.shadowBlur = 18 * K;
    ctx.fillText("Эа", CX, CY + 0.4 * R);
    ctx.shadowBlur = 0;
  }
}

// ------------------------------------------------------------------ кадр
let last = -1;
function frame(t) {
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, H);
  drawMusic(t);
  // «и музыка, и эхо музыки излились в Пустоту, и она перестала быть пустотой»
  const pour = sstep(98, 104, t) * (1 - sstep(110, 115, t));
  if (pour > 0.01) {
    ectx.clearRect(0, 0, echo.width, echo.height); ectx.drawImage(cv, 0, 0, echo.width, echo.height);
    ctx.globalCompositeOperation = "lighter";
    for (const [sc, al, rt] of [[1.35, .22, .04], [1.85, .12, -.07], [2.6, .06, .11]]) {
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(CX, CY); ctx.rotate(rt * (t - 98)); ctx.scale(sc, sc); ctx.translate(-CX, -CY);
      ctx.globalAlpha = al * pour; ctx.drawImage(echo, 0, 0, W, H);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  }
  drawVision(t);
  drawEa(t);
  // свечение
  sctx.globalCompositeOperation = "source-over"; sctx.clearRect(0, 0, small.width, small.height);
  sctx.filter = `blur(${Math.max(2, 3 * K)}px)`; sctx.drawImage(cv, 0, 0, small.width, small.height); sctx.filter = "none";
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 1.0; ctx.drawImage(small, 0, 0, W, H); ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  document.getElementById("bar").style.width = (t / LEN * 100) + "%";
}

// ------------------------------------------------------------------ часы: музыка ведёт
const au = document.getElementById("au"), startEl = document.getElementById("start");
const params = new URLSearchParams(location.search);
let tNow = parseFloat(params.get("t") || "0") || 0, playing = false, lastAudio = -1, lastPerf = 0;
window.__frame = t => { tNow = t; frame(t); };          // для съёмки
function loop(now) {
  if (playing) {
    const a = au.currentTime;
    if (a !== lastAudio) { lastAudio = a; lastPerf = now; tNow = a; }
    else tNow = a + Math.min(0.1, (now - lastPerf) / 1000);
    if (au.ended) { playing = false; tNow = LEN; startEl.style.display = "flex"; }
  }
  if (!window.__manual) frame(Math.min(LEN, tNow));
  requestAnimationFrame(loop);
}
function start() {
  if (tNow >= LEN - 0.5) tNow = 0;
  au.currentTime = tNow; au.play().then(() => { playing = true; startEl.style.display = "none"; }).catch(() => {});
}
startEl.addEventListener("click", start);
let uiTimer = 0;
addEventListener("mousemove", () => { document.body.classList.add("ui"); clearTimeout(uiTimer); uiTimer = setTimeout(() => document.body.classList.remove("ui"), 1800); });
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); if (playing) { au.pause(); playing = false; } else start(); }
  else if (e.code === "ArrowRight" || e.code === "ArrowLeft") {
    tNow = clamp(tNow + (e.code === "ArrowRight" ? 10 : -10), 0, LEN - 0.1); au.currentTime = tNow;
  } else if (e.code === "KeyF") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.code === "Home") { tNow = 0; au.currentTime = 0; }
});
addEventListener("resize", resize);
resize();
requestAnimationFrame(loop);
</script>
