<script>

/* Tengwesta — «система знаков». Свет Двух Древ, вплетённый в решётку: серебряные нити Тельпериона и золотые

const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

const COL = { silver: '#d4e2ff', silverDeep: '#7f98c8', gold: '#ffc95c', goldDeep: '#b9782a', pearl: '#fff3dc', base: '#1a2133' };
const HOUR = 6;                 // секунд в часе
const DAY = 12 * HOUR;          // один день Древ — 72 с

const disp = document.getElementById('c'), dctx = disp.getContext('2d');
const scene = mk(1, 1), sctx = scene.getContext('2d');
const tmp = mk(1, 1), tctx = tmp.getContext('2d');
const bloomC = mk(1, 1), bctx = bloomC.getContext('2d');
let W, H, DPR, sp, A, du, lam, k;
let silverLit, goldLit, baseImg, starImg;
let threadsS = [], threadsG = [], gems = [], cells = [], beads = [];
let SRC_T, SRC_L, RF;
const TH = 28 * Math.PI / 180;
const d1 = [Math.cos(TH), Math.sin(TH)], n1 = [-Math.sin(TH), Math.cos(TH)];    // серебро ↘
const d2 = [Math.cos(TH), -Math.sin(TH)], n2 = [Math.sin(TH), Math.cos(TH)];    // золото ↗
const dot = (a, b) => a[0] * b[0] + a[1] * b[1];

/* ---------- геометрия переплетения ---------- */
function threadPoint(fam, idx, u) {
  const d = fam === 0 ? d1 : d2, n = fam === 0 ? n1 : n2, th = fam === 0 ? threadsS[idx] : threadsG[idx];
  const off = th.c + A * Math.sin(Math.PI * (u - th.u0) / du);
  return [n[0] * off + d[0] * u, n[1] * off + d[1] * u];
}
function intersect(i, j) {   // n1·x = cS_i, n2·x = cG_j
  const a = threadsS[i].c, b = threadsG[j].c, det = n1[0] * n2[1] - n1[1] * n2[0];
  return [(a * n2[1] - b * n1[1]) / det, (n1[0] * b - n2[0] * a) / det];
}
function famRange(n) {
  const v = [[0, 0], [W, 0], [0, H], [W, H]].map(p => dot(p, n));
  return [Math.floor(Math.min(...v) / sp) - 2, Math.ceil(Math.max(...v) / sp) + 2];
}

function build() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = Math.floor(innerWidth * DPR); H = Math.floor(innerHeight * DPR);
  for (const c of [disp, scene, tmp]) { c.width = W; c.height = H; }
  bloomC.width = Math.ceil(W / 4); bloomC.height = Math.ceil(H / 4);
  sp = Math.round(Math.max(48 * DPR, Math.min(W, H) / 10.5)); k = sp / 100;
  du = sp / Math.sin(2 * TH); A = sp * .11; lam = 2 * du;
  SRC_T = [-.12 * W, -.18 * H]; SRC_L = [1.12 * W, -.18 * H]; RF = Math.hypot(W, H) * 1.2;
  // нити
  const [s0, s1] = famRange(n1), [g0, g1] = famRange(n2);
  threadsS = []; threadsG = [];
  for (let i = s0; i <= s1; i++) threadsS.push({ id: i, c: i * sp, u0: 0, cross: [] });
  for (let j = g0; j <= g1; j++) threadsG.push({ id: j, c: j * sp, u0: 0, cross: [] });
  // фаза волны каждой нити: пересечения — в узлах синуса
  threadsS.forEach((th, i) => { th.u0 = dot(intersect(i, 0), d1); });
  threadsG.forEach((th, j) => { th.u0 = dot(intersect(0, j), d2); });
  // камни на пересечениях
  gems = [];
  const gemAt = new Map();
  for (let i = 0; i < threadsS.length; i++) for (let j = 0; j < threadsG.length; j++) {
    const p = intersect(i, j);
    if (p[0] < -sp || p[0] > W + sp || p[1] < -sp || p[1] > H + sp) continue;
    const g = { x: p[0], y: p[1], i, j, over: (threadsS[i].id + threadsG[j].id) % 2 === 0 ? 0 : 1, cS: 0, cG: 0, m: 0,
      uS: dot(p, d1), uG: dot(p, d2) };
    gemAt.set(i + ',' + j, gems.length); gems.push(g);
    threadsS[i].cross.push({ u: g.uS, g: gems.length - 1 }); threadsG[j].cross.push({ u: g.uG, g: gems.length - 1 });
  }
  threadsS.forEach(t => t.cross.sort((a, b) => a.u - b.u)); threadsG.forEach(t => t.cross.sort((a, b) => a.u - b.u));
  // ромбы и тенгвар Фэанорова строя: ряд (тэма) — по серебряному индексу, ступень (тьелле) — по золотому
  cells = [];
  for (let i = 0; i + 1 < threadsS.length; i++) for (let j = 0; j + 1 < threadsG.length; j++) {
    const a = gemAt.get(i + ',' + j), b = gemAt.get((i + 1) + ',' + (j + 1)), c = gemAt.get((i + 1) + ',' + j), d = gemAt.get(i + ',' + (j + 1));
    if ([a, b, c, d].some(v => v === undefined)) continue;
    const x = (gems[a].x + gems[b].x) / 2, y = (gems[a].y + gems[b].y) / 2;
    if (x < -sp || x > W + sp || y < -sp || y > H + sp) continue;
    const tema = ((threadsS[i].id % 5) + 5) % 5, ty = ((threadsG[j].id % 9) + 9) % 9;
    cells.push({ x, y, L: TABLE[ty][tema], tema, ty, i, j, g: [a, b, c, d], top: a, bottom: b, word: null });
  }
  letterCache.clear(); orderCache.clear(); glyphCache.clear(); cellAt.clear(); cells.forEach((c, k) => cellAt.set(c.i + ',' + c.j, k)); word = null;
  makeLayers(); makeStars(); initBeads(); makeGemSprites();
  sctx.fillStyle = '#000'; sctx.fillRect(0, 0, W, H);
}

/* ---------- тенгвы шрифта, разложенные на ножку и дужку ----------
   Буква берётся из шрифта (Tengwar Telcontar, Johan Winge) целиком, а затем раскладывается по растру:
   ножка — самый длинный вертикальный штрих, дужки — всё, что от неё растёт; точки и техты — отдельные части.
   Порядок письма: ножка сверху вниз, затем дужки от места крепления по самому штриху (обход в ширину),
   затем подбуквенные точки и техта. Так свет «пишет» любую тенгву одним законом и одним начертанием. */
const TF = 'TengwarTelcontar';
const DOTS = '';                       // две подбуквенные точки (unutixë) — знак tyelpetéma
const ch = cp => String.fromCodePoint(cp);
const F = (cps, o = {}) => { cps = [].concat(cps); return { base: cps.map(ch).join(''), dots: !!o.dots, tehta: o.tehta || null, mute: !!o.mute, bar: !!o.bar,
  key: cps.join('_') + (o.dots ? 'd' : '') + (o.tehta ? 't' + o.tehta : '') + (o.bar ? 'b' : '') }; };
const TABLE = [
  [F(0xE000), F(0xE001), F(0xE002), F(0xE003), F(0xE000, { dots: 1 })],          // 1  t p c qu | ty
  [F(0xE004), F(0xE005), F(0xE006), F(0xE007), F(0xE004, { dots: 1 })],          // 2  nd mb ng ngw | ndy
  [F(0xE008), F(0xE009), F(0xE00A), F(0xE00B), F(0xE028, { dots: 1 })],          // 3  þ f h hw | hy
  [F(0xE00C), F(0xE00D), F(0xE00E), F(0xE00F), F(0xE00C, { dots: 1 })],          // 4  nt mp nc nqu | nty
  [F(0xE010), F(0xE011), F(0xE012), F(0xE013), F(0xE010, { dots: 1 })],          // 5  n m ñ ñw | ny
  [F(0xE014), F(0xE015), F(0xE016, { mute: 1 }), F(0xE017), F(0xE016, { dots: 1 })], // 6  r v (anna — без звука) w | y
  [F(0xE020), F(0xE021), F(0xE022), F(0xE023), F(0xE020, { dots: 1 })],          // 7  r- rd l ld | ry
  [F(0xE024), F(0xE025), F(0xE026), F(0xE027), F(0xE022, { dots: 1 })],          // 8  s ṡ ss ss | ly
  [F(0xE028), F([0xE02D, 0xE020]), F([0xE02D, 0xE022]), F(0xE02A), F(0xE02B)]   // 9  h- hr hl i u
];
const orderCache = new Map(), letterCache = new Map();
function inkBox(a, S) {
  let x0 = S, y0 = S, x1 = -1, y1 = -1;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (a[(y * S + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return x1 < 0 ? null : { x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}
function rasterGlyph(str, fs, S) {           // глиф по центру квадрата S×S; возвращает альфу
  const c = mk(S, S), x = c.getContext('2d');
  x.font = `${fs}px ${TF}`; x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.fillText(str, S / 2, S * .62);
  return x.getImageData(0, 0, S, S).data;
}
function letterOrder(L) {
  let o = orderCache.get(L.key); if (o) return o;
  const s = sp * .42, S = Math.ceil(s * 2.1), fs = Math.round(s * 1.05), N = S * S;
  const A = new Float32Array(N), ord = new Float32Array(N).fill(2);
  const base = rasterGlyph(L.base, fs, S);
  for (let i = 0; i < N; i++) A[i] = base[i * 4 + 3] / 255;
  const ink = i => A[i] > .16;
  // ножка: столбец с самым длинным вертикальным штрихом
  let best = 0, bx = -1, by0 = 0, by1 = 0;
  const runs = new Int32Array(S);
  for (let x = 0; x < S; x++) {
    let r = 0, rb = 0, ys = 0, ye = 0, start = 0;
    for (let y = 0; y < S; y++) { if (ink(y * S + x)) { if (!r) start = y; r++; if (r > rb) { rb = r; ys = start; ye = y; } } else r = 0; }
    runs[x] = rb; if (rb > best) { best = rb; bx = x; by0 = ys; by1 = ye; }
  }
  const box = inkBox(base, S), hasStem = box && best > (box.y1 - box.y0 + 1) * .62 && best > s * .5;
  const seeds = [];
  if (hasStem) {
    let xl = bx, xr = bx;
    while (xl > 0 && runs[xl - 1] > best * .72) xl--;
    while (xr < S - 1 && runs[xr + 1] > best * .72) xr++;
    for (let x = xl; x <= xr; x++) for (let y = by0; y <= by1; y++) { const i = y * S + x; if (ink(i)) { ord[i] = .38 * (y - by0) / Math.max(1, by1 - by0); seeds.push(i); } }
  }
  // дужки: обход в ширину по штриху от ножки (или от верхней левой точки, если ножки нет)
  const dist = new Int32Array(N).fill(-1); let q = [], maxD = 1;
  const comps = [];
  if (seeds.length) { seeds.forEach(i => dist[i] = 0); q = seeds.slice(); comps.push({ q, main: true }); }
  const bfs = (start, tag) => {
    let head = 0, md = 1; const qq = start;
    while (head < qq.length) {
      const i = qq[head++], x = i % S, y = (i / S) | 0, d = dist[i];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= S || ny >= S) continue;
        const j = ny * S + nx; if (dist[j] >= 0 || !ink(j)) continue;
        dist[j] = d + 1; if (d + 1 > md) md = d + 1; qq.push(j);
      }
    }
    return { list: qq, md, tag };
  };

  if (seeds.length) parts.push(bfs(seeds.slice(), 'main'));
  for (let i = 0; i < N; i++) if (ink(i) && dist[i] < 0) { dist[i] = 0; parts.push(bfs([i], seeds.length || parts.length ? 'extra' : 'main')); }
  const mainP = parts.find(p => p.tag === 'main') || parts[0];
  for (const p of parts) {
    const lo = p === mainP ? (hasStem ? .38 : 0) : .9, span = p === mainP ? (hasStem ? .52 : .9) : .06;
    for (const i of p.list) if (ord[i] > 1) ord[i] = lo + span * dist[i] / p.md;
