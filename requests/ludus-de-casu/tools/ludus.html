<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludus de Casu</title>
<style>
  html,body{margin:0;height:100%;background:#050307;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #vig{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.92) 100%)}
  #ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;opacity:0;transition:opacity .6s;
    font:15px Georgia,"Times New Roman",serif;z-index:5}
  #ui.show{opacity:1}
  #btns{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:8px 14px 10px}
  #ui button{background:rgba(12,8,16,.78);color:#e8c36a;border:1px solid rgba(232,195,106,.5);font:inherit;padding:4px 11px;cursor:pointer}
  #ui button:hover{background:rgba(60,20,40,.85);color:#fff0c8}
  #ui span{color:rgba(232,195,106,.6);margin-left:4px;font-size:13px}
  #tl{position:relative;height:4px;background:rgba(232,195,106,.16)}
  #tlFill{height:100%;width:0;background:#e8c36a}
  #tl i{position:absolute;top:-3px;width:1px;height:10px;background:rgba(255,230,170,.7)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="ui">
  <div id="btns">
    <button data-a="restart" title="R">Сначала</button>
    <button data-a="loop" id="bLoop" title="L">Повтор: вкл</button>
    <button data-a="pause" title="P, пробел">Пауза</button>
    <button data-a="fs" title="F">Во весь экран</button>
    <span>R · L · P · F</span>
  </div>
  <div id="tl"><div id="tlFill"></div></div>
</div>
<script>
'use strict';
/* Ludus de Casu — «Пьеса о Падении»: маска, какую играла бы труппа арлекинов. Сцена — ромбическая шахматка фона
   «Saltatio Larvarum». 45 тактов по 2,4 с (75 уд/мин, такт на три), 108 с, по кругу. Все события — на сетке тактов
   и долей; часы — настоящие; разброс берётся из хеша плитки и засеянного генератора — прогон воспроизводим.
   I Aurea aetas — согласие: трое танцуют зеркально, каждое па возвращает узор к себе.
   II Luxuria — входит Одиночка: где проходит, узор переходит в её цвета; па перестают возвращаться.
   III Casus — всё стягивается в вихрь к середине; вспышка; тьма.
   IV Ruina — пепел: редкие серые осколки падают; через руины идёт Шут Смерти.
   V Risus — смеётся Бог: узор собирается заново из середины — в траурной изнанке; по швам бегут нити Паутины.
   VI Larva — танцоры обводят маску, и её половины сходятся: одна смеётся, другая плачет; занавес.
   Слов нет: маска безмолвна. Письмо — след танца: знаки своей письменности вытанцовываются на поле
   (согласие — двое зеркально, искажённый — Одиночка, обломки — Шут Смерти, смех — трое).
   Маска собирается половинами через всё представление: тень контура (I), смеющаяся половина Одиночки (II),
   плачущая половина в пепле (IV), обводка и схождение (VI). */

const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const sm = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const h01 = (n, k) => { let x = (n ^ (k * 0x9E3779B1)) >>> 0; x = Math.imul(x ^ x >>> 16, 0x45d9f3b) >>> 0; x = Math.imul(x ^ x >>> 16, 0x45d9f3b) >>> 0; return ((x ^ x >>> 16) >>> 0) / 4294967296; };

const BEAT = .8, BAR = 2.4, NBARS = 45, LEN = NBARS * BAR;   // 108 с
const B = n => +(n * BAR).toFixed(4);

/* ---------- цвета ---------- */
const COL = Object.fromEntries(Object.entries({
  a: '#b3122e', b: '#d9a02a', c: '#e6dcc4', d: '#203f7a', dark: '#120c16', void: '#060408',
  bone: '#efe5cf', ink: '#0a070c', tear: '#d1163a', gold: '#e8b84a', night: '#3a1440', rim: '#d9a02a',
  s1: '#b25fe0', s2: '#ff4fa8', s3: '#ffd0f4', sd: '#2a0f2a', ash1: '#7a736c', ash2: '#34302f',
  g_gold: '#ffe08a', g_pink: '#ff8ad8', g_bone: '#f2ead8', g_ivory: '#fff4dc', tearD: '#6e1424'
}).map(([k, v]) => [k, hex2rgb(v)]));
const DANCER_COL = [hex2rgb('#ffd27a'), hex2rgb('#b07cff'), hex2rgb('#f2ead8')];
const SOL_COL = hex2rgb('#ff5fc0'), JEST_COL = hex2rgb('#f4eadc');
const DARKS = new Set(['dark', 'ink', 'void', 'sd', 'ash2']);

/* ---------- холст и решётка (центр плитки = p·(w,h) + q·(−w,h)) ---------- */
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W, H, DPR, TW, TH, CX, CY, tiles = [], grid = new Map();
const key = (p, q) => p * 4096 + q;
function newTile(p, q) {
  const hs = ((p * 73856093) ^ (q * 19349663)) >>> 0;
  return { p, q, hs, h1: h01(hs, 1), h2: h01(hs, 2), h3: h01(hs, 3), h4: h01(hs, 4), phi: 0, phi0: 0, phi1: 0, f0: -9, fdur: .7, axis: 0,
    faces: ['void', 'void'], show: ['night', 'night'], dx: 0, dy: 0, vx: 0, vy: 0, s: 0, vs: 0, tint: 0, tc: [0, 0, 0],
    prx: 0, pry: 0, prot: 0, mx: 0, my: 0, rot: 0, sc: 1, glow: 0 };
}
function build(fresh) {
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  W = cv.width = Math.floor(innerWidth * DPR); H = cv.height = Math.floor(innerHeight * DPR); CX = W / 2; CY = H * .48;
  TW = Math.max(9, Math.round(Math.min(W, H) / 58)); TH = Math.round(TW * 1.55);
  const old = fresh ? new Map() : grid; tiles = []; grid = new Map();
  const mX = 8 * TW, mY = 8 * TH;
  for (let s = -40; s <= Math.ceil(H / TH) + 40; s++) for (let d = -60; d <= Math.ceil(W / TW) + 60; d++) {
    if ((s + d) & 1) continue;
    const p = (s + d) / 2, q = (s - d) / 2, x = (p - q) * TW, y = (p + q) * TH;
    if (x < -mX || x > W + mX || y < -mY || y > H + mY) continue;
    const T = old.get(key(p, q)) || newTile(p, q);
    T.x = x; T.y = y; tiles.push(T); grid.set(key(p, q), T);
    const m = maskAt(x, y), mL = maskAt(CX + (x - CX) / 1.3, y);
    T.rim = m === 'rim'; T.inL = x < CX && mL !== 'night';
    T.inR = x > CX && m !== 'night'; T.rCol = { ink: 'ash2', bone: 'ash1', tear: 'tearD', rim: 'ash1', gold: 'ash1' }[m] || 'ash2';
  }
}
function contentColor(T, mode) {
  const { p, q } = T, even = ((p + q) & 1) === 0;
  switch (mode) {
    case 'norm': return even ? ((p & 1) ? 'b' : 'a') : 'dark';
    case 'inv': return even ? 'dark' : ((p & 1) ? 'd' : 'c');
    case 'slaa': return even ? (T.h1 < .5 ? 's1' : T.h1 < .85 ? 's2' : 's3') : 'sd';
    case 'ash': return T.h2 < .55 ? 'ash1' : 'ash2';
    case 'mask': return maskAt(T.x, T.y);
    case 'maskL': {   // смеющаяся половина Одиночки: растянута и в её цветах
      const m = maskAt(CX + (T.x - CX) / 1.3, T.y);
      return { bone: 's3', ink: 'sd', gold: 's2', tear: 's2', rim: 's1' }[m] || contentColor(T, 'slaa');
    }
    default: return mode.startsWith('g_') ? mode : 'void';
  }
}
const faceHalfW = vv => vv < 0 ? .74 * Math.sqrt(clamp(1 - Math.pow((vv + .02) / .98, 2))) : .74 * Math.sqrt(clamp(1 - vv * vv)) * (1 - .34 * vv);
const MASK_S = () => H * .44;
function maskAt(x, y) {
  const S = MASK_S(), u = (x - CX) / S, v = (y - CY) / S;
  const halfW = faceHalfW(v);
  if (v < -1 || v > .98 || Math.abs(u) > halfW + .07) return 'night';
  if (Math.abs(u) > halfW) return 'rim';
  const left = u < 0, skin = left ? 'bone' : 'ink', feat = left ? 'ink' : 'bone';
  if (Math.abs(u) / .1 + Math.abs(v + .62) / .14 < 1) return 'gold';
  for (const sx of [-1, 1]) {
    const ex = u - sx * .27, ey = v + .14, a = -sx * .3, xr = ex * Math.cos(a) - ey * Math.sin(a), yr = ex * Math.sin(a) + ey * Math.cos(a);
    if (Math.abs(xr) < .2 && Math.abs(yr) < .095 * (1 - Math.pow(xr / .2, 2))) return feat;
    const by = sx < 0 ? -.33 - .07 * (1 - Math.pow(ex / .2, 2)) : -.3 + .06 * (ex / .2);
    if (Math.abs(ex) < .21 && Math.abs(v - by) < .04) return feat;
  }
  if (!left && (Math.abs(u - .3) / .05 + Math.abs(v - .1) / .085 < 1 || Math.abs(u - .31) / .035 + Math.abs(v - .27) / .06 < 1)) return 'tear';
  if (Math.abs(u) < .3) { const c = left ? -.13 : .11, my = .44 + c * Math.pow(u / .3, 2); if (Math.abs(v - my) < .055) return feat; }
  if (left && Math.abs(u + .33) / .04 + Math.abs(v - .16) / .06 < 1) return 'tear';
  return skin;
}

/* ---------- часы ---------- */
let rt = 0, last = performance.now(), paused = false, loopOn = true;
let rng = mulberry32(0xA11E9);
const tau = t => t + BEAT / TAU * .85 * Math.sin(TAU * t / BEAT);

/* ---------- состояние представления (функции времени) ---------- */
const seduce = () => sm(24, 43.2, rt);
const vortexV = () => rt < 43.2 ? 0 : rt < 55.2 ? Math.pow((rt - 43.2) / 12, 1.6) : 1;
const phase = () => rt < 55.2 ? 'live' : rt < 57.6 ? 'dark' : rt < 72 ? 'ruina' : 'risus';
const vortex = (x, y) => {                                         // стягивание к середине по спирали
  const v = vortexV(); if (v <= 0) return [x, y];
  const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
  const R0 = Math.min(W, H) * .5, a2 = a + v * v * 7 * (1 + 1.5 / (r / R0 + .25)), r2 = r * Math.pow(1 - v, 1.4);
  return [CX + Math.cos(a2) * r2, CY + Math.sin(a2) * r2];
};

/* ---------- танцоры ---------- */
function harmPos(i, t) {
  const s = tau(t) * .21, x0 = CX + W * .34 * Math.sin(s) * Math.cos(.31 * s), y0 = CY + H * .3 * Math.sin(1.37 * s + .7);
  return i === 0 ? [x0, y0] : i === 1 ? [2 * CX - x0, y0] : [2 * CX - x0, 2 * CY - y0];
}
function solPos(t) {
  const e = sm(24, 38.4, t), x = lerp(-.12 * W, CX, e) + W * .14 * Math.sin(.9 * t) * (1 - .6 * e), y = CY + H * .28 * Math.sin(.63 * t) * (1 - sm(24, 43.2, t) * .8);
  return [x, y];
}
const jx = t => {                  // путь Шута Смерти по x: входит, пишет обломки знака, уходит направо
  const K = [[59.2, -.08], [62.4, .16], [67.2, .44], [71.5, 1.08]];
  if (t <= K[0][0]) return K[0][1] * W;
  for (let k = 1; k < K.length; k++) if (t <= K[k][0]) return lerp(K[k - 1][1], K[k][1], (t - K[k - 1][0]) / (K[k][0] - K[k - 1][0])) * W;
  return K[3][1] * W;
};
function dancerState(i, t) {      // [x, y, вес, цвет] — свой путь, а во время письма — перо
  const b = baseDancer(i, t);
  for (const J of jobs) {
    const tr = J.tracks.find(k => k.d === i); if (!tr) continue;
    const w = sm(J.t0 - .6, J.t0, t) * (1 - sm(J.t1, J.t1 + .6, t)); if (w <= 0) continue;
    const [px, py] = penAt(tr, clamp((t - J.t0) / (J.t1 - J.t0)));
    const base = b || [px, py, 0, i === 3 ? SOL_COL : i === 4 ? JEST_COL : DANCER_COL[i]];
    return [lerp(base[0], px, w), lerp(base[1], py, w), Math.max(base[2], w), base[3]];
  }
  return b;
}
function baseDancer(i, t) {
  if (i < 3) {
    if (t < 4.8) return null;
    if (t < 55.2) {
      let [x, y] = harmPos(i, t); const sd = sm(24, 43.2, t);
      if (sd > 0) { const [sx, sy] = solPos(t), ro = H * .15 * (1 - .5 * sd), a = 1.7 * t + i * 2.094; x = lerp(x, sx + ro * Math.cos(a), sm(0, .8, sd)); y = lerp(y, sy + ro * Math.sin(a), sm(0, .8, sd)); }
      [x, y] = vortex(x, y);
      return [x, y, sm(4.8, 7.2, t), DANCER_COL[i]];
    }
    if (t < 74.4 || t > 97.2) return null;
    const [hx, hy] = harmPos(i, t), r = sm(74.4, 79.2, t);
    return [lerp(CX, hx, r), lerp(CY, hy, r), sm(74.4, 75.6, t) * (1 - sm(96, 97.2, t)), DANCER_COL[i]];
  }
  if (i === 3) { if (t < 24 || t >= 55.2) return null; const [x, y] = vortex(...solPos(t)); return [x, y, sm(24, 25.2, t), SOL_COL]; }
  if (i === 4) { if (t < 59.2 || t > 71.5) return null; return [jx(t), H * .56 + H * .05 * Math.sin(TAU * t / (BEAT * 2)), sm(59.2, 60.4, t) * (1 - sm(70.5, 71.5, t)), JEST_COL]; }
  return null;
}
const DANCERS = [0, 1, 2, 3, 4];
let dancers = [];

/* ---------- па ---------- */
let waves = [], glides = [], spins = [], laughs = [], threads = [];
function flipTile(T, mode, t0, axis, dur = .7) {
  const k = Math.round(T.phi1 / Math.PI);
  if (T.show[k & 1] === mode) return;
  T.faces[(k + 1) & 1] = contentColor(T, mode); T.show[(k + 1) & 1] = mode;
  T.phi0 = T.phi; T.phi1 = (k + 1) * Math.PI; T.f0 = t0; T.fdur = dur; T.axis = axis;
}
function startWave(kind, mode, o = {}) {
  waves.push({ kind, mode, t0: rt, speed: o.speed || W * .55, ang: o.ang ?? 0, ox: o.ox ?? CX, oy: o.oy ?? CY, axis: o.axis ?? 0,
    dur: o.dur || .7, maxR: o.maxR || Infinity, only: o.only || null, done: new Set() });
}
function waveDist(w, T) {
  if (w.kind === 'line') { const ca = Math.cos(w.ang), sa = Math.sin(w.ang); return (T.x * ca + T.y * sa) - Math.min(0, W * ca, H * sa, W * ca + H * sa); }
  if (w.kind === 'open') return Math.abs(T.x - CX);
  if (w.kind === 'close') return Math.max(0, W / 2 - Math.abs(T.x - CX));
  if (w.kind === 'contour') {           // от обведённого контура — внутрь лица и наружу
    const S = MASK_S(), u = (T.x - CX) / S, v = (T.y - CY) / S, hw = v < -1 || v > .98 ? 0 : faceHalfW(v);
    return (Math.abs(Math.abs(u) - hw - .035) + Math.max(0, -1 - v) + Math.max(0, v - .98)) * S;
  }
  const dx = T.x - w.ox, dy = T.y - w.oy, r = Math.hypot(dx, dy);
  return w.kind === 'spiral' ? r + (Math.atan2(dy, dx) + Math.PI) / TAU * TW * 14 : r;
}
function updWaves() {
  for (const w of waves) {
    const front = (rt - w.t0) * w.speed;
    for (const T of tiles) {
      if (w.done.has(T)) continue;
      if (w.only && !w.only(T)) { w.done.add(T); continue; }
      const d = waveDist(w, T);
      if (d > w.maxR) { w.done.add(T); continue; }
      if (d <= front) { w.done.add(T); flipTile(T, w.mode, w.t0 + d / w.speed, w.axis, w.dur); }
    }
    if (w.done.size >= tiles.length) w.end = true;
  }
  waves = waves.filter(w => !w.end);
}
function startGlide(o = {}) {
  const dir = rng() < .5 ? 1 : 2, sign = rng() < .5 ? -1 : 1, width = 2 + (rng() * 3 | 0) * 2;
  const T0 = pickTile(), c0 = dir === 1 ? T0.q : T0.p;
  glides.push({ dir, sign, a: c0 - width / 2, b: c0 + width / 2, t0: rt, dur: BAR * .9, step: o.broken ? 1 : 2, broken: !!o.broken });
}
function startSpin(o = {}) {
  const T0 = pickTile();
  spins.push({ pc: T0.p, qc: T0.q, cx: T0.x, cy: T0.y, k: 3 + (rng() * 3 | 0), t0: rt, dur: BAR * .85, dir: rng() < .5 ? -1 : 1,
    turn: o.excess ? 1.5 : 1, excess: !!o.excess });
}
function pickTile() { for (let i = 0; i < 40; i++) { const T = tiles[(rng() * tiles.length) | 0]; if (T.x > W * .12 && T.x < W * .88 && T.y > H * .12 && T.y < H * .85) return T; } return tiles[0]; }
function startLaugh(x, y, n = 3, amp = .55, col) { for (let i = 0; i < n; i++) laughs.push({ x, y, t0: rt + i * BEAT / 3, speed: W * .7, amp: amp - i * amp * .18, col }); }
function addThread() { threads.push({ T0: pickTile(), dir: rng() < .5 ? 1 : 2, t0: rt, dur: 1.6 }); }

/* ---------- письмо — след танца: знаки своей письменности ---------- */
const arcPts = (cx_, cy_, r, a0, a1, n = 28) => Array.from({ length: n + 1 }, (_, k) => { const a = (a0 + (a1 - a0) * k / n) * Math.PI / 180; return [cx_ + r * Math.cos(a), cy_ + r * Math.sin(a)]; });
const mirrorS = st => st.map(([x, y]) => [-x, y]);
const ORDO_R = [arcPts(.15, 0, .75, -100, 100), arcPts(.15, 0, .38, -70, 70), [[0, -1.15], [.12, -1.02], [.3, -.84]], [[0, 1.15], [.14, 1.02], [.32, .86]]];
const ORDO_L = ORDO_R.map(mirrorS);
const skewS = st => st.map(([x, y]) => [x * 1.35 + .3 * y, y * 1.1]);
const spiralS = Array.from({ length: 49 }, (_, k) => { const th = k / 48 * 3 * Math.PI, r = .06 + .16 * th / Math.PI; return [.2 + r * Math.cos(th), 1.05 + .7 * r * Math.sin(th)]; });
const GLYPHS = {
  ordo: { at: () => [CX, CY], sc: () => H * .3, tracks: [[0, ORDO_L], [1, ORDO_R]] },                 // согласие: двое зеркально
  lux: { at: () => [CX - W * .08, CY], sc: () => H * .3, tracks: [[3, [...ORDO_R, ...ORDO_L.map(skewS), spiralS]]] },
  ruin: { at: () => [W * .3, H * .48], sc: () => H * .24, tracks: [[4, [...ORDO_L, ...ORDO_R]]], dashed: true },
  risus: { at: () => [CX, CY - H * .02], sc: () => H * .3, tracks: [[0, [arcPts(0, -.25, .45, 25, 155)]], [1, [arcPts(0, -.25, .75, 25, 155)]], [2, [arcPts(0, -.25, 1.05, 25, 155)]]] }
};
let jobs = [], hints = [];
function makeTrack(d, strokes, gx, gy, S, dashed, seed) {
  const r = mulberry32(seed), pts = [], step = TW * .45; let sAcc = 0, last = null;
  strokes.forEach((st, si) => {
    const jx_ = dashed ? (r() - .5) * .12 : 0, jy_ = dashed ? (r() - .5) * .12 : 0;
    const P = st.map(([x, y]) => [gx + (x + jx_) * S, gy + (y + jy_) * S]);
    for (let k = 0; k < P.length; k++) {
      const [x, y] = P[k];
      if (last) {
        const L = Math.hypot(x - last[0], y - last[1]), n = Math.max(1, Math.ceil(L / step)), trace = k > 0;
        for (let j = 1; j <= n; j++) {
          sAcc += L / n; const xx = lerp(last[0], x, j / n), yy = lerp(last[1], y, j / n);
          pts.push({ x: xx, y: yy, s: sAcc, tr: trace && !(dashed && Math.floor(sAcc / (TW * 3)) % 3 === 2), done: false });
        }
      } else pts.push({ x, y, s: 0, tr: false, done: false });
      last = [x, y];
    }
  });
  return { d, pts, L: sAcc || 1 };
}
function penAt(tr, u) {
